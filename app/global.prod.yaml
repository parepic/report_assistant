# Production config used inside containers.
# Loaded when REPORT_ASSISTANT_ENV is set to "production" or "prod".

data_path: "app/data/"
output_path: "app/output/"

report_id: "apple_10-k-item1a-2023"

OLLAMA_URL: "http://localhost:11434"
POSTGRESQL_URL: "postgresql+psycopg://postgres:postgres@postgres:5432/report_assistant"
QDRANT_URL: "http://qdrant:6333"
LLM_MODEL_CHATBOT: "gpt-4.1-mini"
LLM_MODEL_SUMMARIZER: "gpt-4.1-mini"
LLM_MODEL_EVAL: "gpt-4.1-mini"


QDRANT_DB_NAME_CHATBOT: "report_assistant_chatbot"
QDRANT_DB_NAME_YOY: "report_assistant_yoy"
EMBEDDING_PROFILE: {
  "provider": "openai",
  "embed_model": "text-embedding-3-small",
}

# Chunking variables
chunk_strategy_chatbot: {
  "method":"sentence_metadata",
  "chunk_size": 3,
  "overlap": 1
}

chunk_strategy_yoy: {
  "method":"paragraph",
}

# Retrieval variables
top_k: 4

# Test variables
print_chunks: True
threshold: 0.7
